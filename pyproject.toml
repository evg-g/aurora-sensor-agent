[project]
name = "aurora-sensor-agent"
version = "0.1.0"
description = "Aurora Clinic IoT cold-chain temperature sensor agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "evgmongo-maker" }]
dependencies = [
    "pydantic>=2.9,<3",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.112,<7",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[project.scripts]
aurora-agent = "aurora_sensor_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_sensor_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "hil: hardware-in-the-loop tests; deselected by default, run only with real hardware",
]

[tool.coverage.run]
branch = true
source = ["src/aurora_sensor_agent"]

[tool.coverage.report]
show_missing = true
