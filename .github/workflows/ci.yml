name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - run: uv run mypy

  test:
    name: unit + logic + buffer + gpio + serial + fault + contract + fleet + soak tiers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      # These tiers must pass with no hardware, no network, and no Docker. hil and sil are excluded:
      # hil needs real hardware, sil needs Docker + the API image (its own job below).
      - run: uv run pytest tests -q -m "not hil and not sil" --cov --cov-report=xml --cov-report=term-missing

  contract:
    name: telemetry contract drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Cross-repo drift check needs the API repo. Set the API_REPO variable (e.g. owner/appointments-api)
      # to enable it; without it the job runs the in-repo checksum guard only and stays green.
      - if: vars.API_REPO != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.API_REPO }}
          path: appointments-api
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - name: contract drift gate
        env:
          AURORA_API_REPO: ${{ vars.API_REPO != '' && '../appointments-api' || 'appointments-api' }}
        run: uv run python scripts/check_contract.py

  sil:
    name: software-in-the-loop (agent vs Mosquitto + API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # SIL needs the built API image. When API_REPO is set, check it out and build the image;
      # otherwise the SIL tests skip cleanly (the image is absent) and the job stays green.
      - if: vars.API_REPO != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.API_REPO }}
          path: api-src
      - if: vars.API_REPO != ''
        run: docker build -t appointments-api:local api-src
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - run: uv run pytest tests/sil -q -m sil

  package:
    name: build wheel + .deb + signed OTA manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - name: build wheel + .deb
        run: bash scripts/build_deb.sh
      - name: sign + verify an OTA manifest
        # Uses the release private key when configured, else an ephemeral key so the flow is
        # exercised on every PR. Either way the artifact is verified before upload.
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: bash scripts/ci_sign_ota.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/manifest.json
            keys/ota_public.pem
          retention-days: 14

  security:
    name: security (audit, secrets, image scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits on pull_request events
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - name: pip-audit (fail on known CVEs in dependencies)
        run: uv run --with pip-audit pip-audit
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Regression guard: a local OTA signing key once ended up in images built with `COPY . .`.
      # Put a decoy key where a developer's real one lives, build, and fail if it reaches the image.
      - name: Build the image with a decoy signing key in the context
        run: |
          mkdir -p keys
          echo "decoy - must never be copied into the image" > keys/ota_private.pem
          docker build -t aurora-sensor-agent:ci .
      - name: The image contains no keys/ or packaging staging
        run: |
          docker run --rm --entrypoint sh aurora-sensor-agent:ci -c \
            'test ! -e /app/keys && test ! -e /app/staging' \
            || { echo "::error::keys/ or staging/ was copied into the image - check .dockerignore"; exit 1; }
      - name: Trivy image scan (fail on HIGH/CRITICAL vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aurora-sensor-agent:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
