[project]
name = "aurora-sensor-agent"
version = "0.1.0"
description = "Aurora Clinic IoT cold-chain temperature sensor agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "evg-g" }]
dependencies = [
    "pydantic>=2.9,<3",
    "structlog>=24.4,<25",
    "paho-mqtt>=2.1,<3",
    "httpx>=0.27,<0.29",
    "cryptography>=43,<45",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.112,<7",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "pyserial>=3.5,<4",
    "gpiozero>=2.0,<3",
    "jsonschema>=4.23,<5",
    "testcontainers>=4.8,<5",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.23,<5",
]

[project.scripts]
aurora-agent = "aurora_sensor_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_sensor_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests"]

# Optional hardware libraries are imported lazily in real/ and are not installed off-device.
# They have no type stubs, so tell mypy to treat them as untyped rather than fail to find them.
# pyserial and gpiozero ARE installed (dev deps, used by the serial and GPIO test tiers), but ship no
# usable stubs, so they are treated as untyped too.
[[tool.mypy.overrides]]
module = ["smbus2", "smbus2.*", "serial", "serial.*", "gpiozero", "gpiozero.*"]
ignore_missing_imports = true

# testcontainers + docker (SIL tier only) ship no usable stubs; treat them as untyped.
[[tool.mypy.overrides]]
module = ["testcontainers", "testcontainers.*", "docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "hil: hardware-in-the-loop tests; deselected by default, run only with real hardware",
    "sil: software-in-the-loop tests; need Docker + the API image, run in their own CI job",
]

[tool.coverage.run]
branch = true
source = ["src/aurora_sensor_agent"]

[tool.coverage.report]
show_missing = true
